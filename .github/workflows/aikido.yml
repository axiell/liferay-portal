name: Aikido Security

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable scanner --debug output"
        type: boolean
        default: false

permissions:
  contents: read

# One job per scan type, each calling .github/workflows/aikido-scan-type.yml.
# Two reasons for the split, both learned the hard way on this tree:
#
#  1. RUNTIME. Four types in one job cost the SUM of their runtimes against a
#     single budget, and that budget was already within 5 minutes of GitHub's
#     360m job ceiling - there was nowhere left to raise it. Run 33012395448
#     burned 5h46m and failed. Split, the wall clock is the SLOWEST type, and a
#     type that cannot finish no longer takes the other three down with it:
#     each reports its own result. (That run predates the 2026-08-29 exclude
#     fix, when all 23 patterns were inert and the scan covered the whole tree,
#     so the split is insurance as much as cure.)
#  2. SEEDING. `--force-create-repository-for-branch` creates the per-branch
#     Aikido repository row, and four jobs racing to create the same row is
#     asking for trouble. `dependencies` is the cheapest type, so it seeds the
#     row first and the other three wait on it via `needs:`.
jobs:
  dependencies:
    name: Aikido scan
    uses: ./.github/workflows/aikido-scan-type.yml
    with:
      scan_type: dependencies
      debug: ${{ inputs.debug }}
    secrets: inherit

  # fail-fast is off: a failure in one type must not cancel the others, or a
  # single dead scanner costs the whole inventory again.
  rest:
    name: Aikido scan
    needs: dependencies
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        scan_type: [secrets, iac, code]
    uses: ./.github/workflows/aikido-scan-type.yml
    with:
      scan_type: ${{ matrix.scan_type }}
      debug: ${{ inputs.debug }}
    secrets: inherit
