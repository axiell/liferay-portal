name: Aikido Security

on:
  workflow_dispatch:
  pull_request:
    branches:
      - arena-7.4.3.129-ga129
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  AIKIDO_SCANNER_VERSION: "1.0.139"
  AIKIDO_SCANNER_SHA256: "41b4368ee0ffbb195015a39119a7cc9db2ff0aefa8388bc01e48b747c6d4d2d1"

jobs:
  aikido-scan:
    name: Aikido scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Aikido scanner
        id: cache-scanner
        uses: actions/cache@v4
        with:
          path: ~/aikido-scanner
          key: aikido-scanner-${{ env.AIKIDO_SCANNER_VERSION }}-${{ env.AIKIDO_SCANNER_SHA256 }}-linux-x86_64

      - name: Download Aikido scanner
        if: steps.cache-scanner.outputs.cache-hit != 'true'
        run: |
          curl -fsL "https://aikido-local-scanner.s3.eu-west-1.amazonaws.com/v${{ env.AIKIDO_SCANNER_VERSION }}/linux_X86_64/aikido-local-scanner.zip" \
            -o /tmp/aikido-scanner.zip
          echo "${{ env.AIKIDO_SCANNER_SHA256 }}  /tmp/aikido-scanner.zip" | sha256sum -c -
          unzip /tmp/aikido-scanner.zip -d ~/aikido-scanner/
          chmod +x ~/aikido-scanner/aikido-local-scanner

      - name: Detect new vulnerabilities (PR)
        if: github.event_name == 'pull_request'
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_SECRET_KEY }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ~/aikido-scanner/aikido-local-scanner scan \
            --apikey "$AIKIDO_API_KEY" \
            --repositoryname "$REPO" \
            --branchname "$HEAD_REF" \
            --gating-mode pr \
            --base-commit-id "$BASE_SHA" \
            --head-commit-id "$HEAD_SHA" \
            --fail-on critical \
            --scan-types dependencies \
            -- "$GITHUB_WORKSPACE"

      - name: Detect new vulnerabilities (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_SECRET_KEY }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ~/aikido-scanner/aikido-local-scanner scan \
            --apikey "$AIKIDO_API_KEY" \
            --repositoryname "$REPO" \
            --branchname "$REF_NAME" \
            --fail-on critical \
            --scan-types dependencies \
            -- "$GITHUB_WORKSPACE"
