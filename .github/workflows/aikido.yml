name: Aikido Security

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable scanner --debug output"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AIKIDO_SCANNER_VERSION: "1.0.139"
  AIKIDO_SCANNER_SHA256: "41b4368ee0ffbb195015a39119a7cc9db2ff0aefa8388bc01e48b747c6d4d2d1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aikido-scan:
    name: Aikido scan
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Aikido scanner
        id: cache-scanner
        uses: actions/cache@v4
        with:
          path: ~/aikido-scanner
          key: aikido-scanner-${{ env.AIKIDO_SCANNER_VERSION }}-${{ env.AIKIDO_SCANNER_SHA256 }}-linux-x86_64

      - name: Download Aikido scanner
        if: steps.cache-scanner.outputs.cache-hit != 'true'
        run: |
          curl -fsL "https://aikido-local-scanner.s3.eu-west-1.amazonaws.com/v${{ env.AIKIDO_SCANNER_VERSION }}/linux_X86_64/aikido-local-scanner.zip" \
            -o /tmp/aikido-scanner.zip
          echo "${{ env.AIKIDO_SCANNER_SHA256 }}  /tmp/aikido-scanner.zip" | sha256sum -c -
          unzip /tmp/aikido-scanner.zip -d ~/aikido-scanner/
          chmod +x ~/aikido-scanner/aikido-local-scanner
      - name: Detect new vulnerabilities
        # Soft-fail: scanner uploads results fine, but its post-scan gating
        # status-poll currently returns "Endpoint no longer accesible"
        # (Aikido server-side). Keep CI green while results still land in the
        # Aikido console; remove once Aikido restores the poll endpoint.
        continue-on-error: true
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_SECRET_KEY }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Honor the repo-root .aikido-exclude so CI and local scans share one
          # exclude list. One pattern per line; blank lines and # comments skipped.
          #
          # --exclude is a plain, case-sensitive SUBSTRING match on the path
          # (measured against scanner v1.0.139 on 2026-08-29), not a glob and not
          # a path matcher: any pattern containing '*' matches nothing and fails
          # silently, and a bare name matches mid-word (`modules/test` would also
          # drop `modules/test-util*`). Slash-wrapped segments are the correct
          # form. See .aikido-exclude for the full rules.
          EXCLUDES=()
          if [[ -f .aikido-exclude ]]; then
            while IFS= read -r pattern; do
              [[ -z "$pattern" || "$pattern" == \#* ]] && continue
              EXCLUDES+=(--exclude "$pattern")
            done < .aikido-exclude
          fi

          # Generic build-tool cache/output excludes, mirroring the local wrapper.
          EXCLUDES+=(
            --exclude /.gradle/
            --exclude /.m2/
            --exclude /.ai/
            --exclude /target/
            --exclude /classes/
            --exclude /tmp/
          )

          # Fail loudly rather than scanning at full scope by accident.
          INERT=()
          for e in "${EXCLUDES[@]}"; do
            case "$e" in --exclude) continue ;; *[\*\?]*|./*) INERT+=("$e") ;; esac
          done
          # A leading hyphen is not merely useless: the pattern is forwarded
          # verbatim into checkov's --skip-path and Semgrep's argv, which parse
          # it as a flag. The IaC and SAST stages then fail while the run still
          # exits 0 - two silently dead scanners. Fail the job instead.
          BADDASH=()
          for e in "${EXCLUDES[@]}"; do
            case "$e" in --exclude) continue ;; -*) BADDASH+=("$e") ;; esac
          done
          if [[ ${#BADDASH[@]} -gt 0 ]]; then
            echo "::error::exclude pattern(s) start with '-' and will break the IaC and SAST scans: ${BADDASH[*]}. Drop the leading hyphen ('test/' covers '-test/')."
            exit 1
          fi
          if [[ ${#INERT[@]} -gt 0 ]]; then
            echo "::warning::${#INERT[@]} exclude pattern(s) can never match (--exclude is a substring match, not a glob): ${INERT[*]}"
          fi

          # Print what actually reached the scanner; the GitHub log only echoes
          # the script source, never the expansion.
          echo "Applying ${#EXCLUDES[@]} args from .aikido-exclude:"
          printf '  %s %s\n' "${EXCLUDES[@]}"

          SCAN_LOG=/tmp/aikido-scan.log
          ~/aikido-scanner/aikido-local-scanner scan \
            --repositoryname "$REPO" \
            --branchname "$REF_NAME" \
            --fail-on critical \
            --scan-types dependencies \
            "${EXCLUDES[@]}" \
            ${{ inputs.debug && '--debug' || '' }} \
            -- "$GITHUB_WORKSPACE" 2>&1 | tee "$SCAN_LOG"
          SCAN_STATUS=${PIPESTATUS[0]}

          # A stage can fail while the run still exits 0 and prints a findings
          # summary, which reads as a healthy scan that found nothing. Not a
          # findings verdict, so fail the job independently of the gate.
          if grep -qiE 'scan failed|failed to output result|checkov: error' "$SCAN_LOG"; then
            echo "::error::One or more Aikido scan stages FAILED - these results are incomplete and must not be read as clean."
            grep -iE 'scan failed|failed to output result|checkov: error' "$SCAN_LOG" | sed 's/^/  /'
            exit 3
          fi

          exit "$SCAN_STATUS"
